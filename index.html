                          <line x1="0" y1="30" x2="500" y2="30" stroke="#1e2330" strokeDasharray="2 4" />
                          <line x1="0" y1="80" x2="500" y2="80" stroke="#1e2330" strokeDasharray="2 4" />
                          <line x1="0" y1="130" x2="500" y2="130" stroke="#1e2330" strokeDasharray="2 4" />
                          
                          {/* Safe Line */}
                          <path d="M0,130 Q100,100 200,80 T400,90 T500,70" fill="none" stroke="#22c55e" strokeWidth="1.5" />
                          {/* Suspicious Line */}
                          <path d="M0,150 Q100,140 200,120 T400,110 T500,95" fill="none" stroke="#f97316" strokeWidth="1.5" />
                          {/* High Risk Area & Line */}
                          <path d="M0,165 Q100,155 200,145 T350,115 T500,80 L500,180 L0,180 Z" fill="url(#redGrad)" />
                          <path d="M0,165 Q100,155 200,145 T350,115 T500,80" fill="none" stroke="#ef4444" strokeWidth="2" />
                        </svg>
                      </div>
                      <div className="flex justify-end gap-6 pt-2 font-mono text-[10px]">
                        <span className="text-green-400">● Safe</span>
                        <span className="text-orange-400">● Suspicious</span>
                        <span className="text-red-400">● High Risk</span>
                      </div>
                    </div>

                    {/* Threat Distribution */}
                    <div className="panel p-4 flex flex-col">
                      <div className="mb-3">
                        <div className="label-section">Threat Distribution</div>
                        <div className="font-mono text-xs text-text-muted">Category breakdown</div>
                      </div>
                      <div className="flex-1 flex flex-col justify-center gap-3">
                        {[
                          { name: 'Phishing', count: 412, pct: 32.1, color: '#ef4444' },
                          { name: 'Malicious URL', count: 298, pct: 23.2, color: '#f97316' },
                          { name: 'Suspicious IP', count: 201, pct: 15.7, color: '#eab308' },
                          { name: 'Credential Attack', count: 178, pct: 13.9, color: '#ef4444' },
                          { name: 'Malware', count: 132, pct: 10.3, color: '#dc2626' },
                        ].map(item => (
                          <div key={item.name} className="flex flex-col gap-1">
                            <div className="flex justify-between font-mono text-xs">
                              <span className="text-text-secondary">{item.name}</span>
                              <span className="text-text-muted">{item.count} ({item.pct}%)</span>
                            </div>
                            <div className="h-1.5 bg-bg-surface rounded-full overflow-hidden">
                              <div className="h-full rounded-full" style={{ width: `${item.pct}%`, backgroundColor: item.color }}></div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Live Security Feed */}
                  <div className="panel">
                    <div className="p-4 border-b border-border-subtle flex justify-between items-center">
                      <div>
                        <div className="label-section">Live Security Feed</div>
                        <div className="font-mono text-xs text-text-muted">Real-time event stream</div>
                      </div>
                      <span className="font-mono text-xs text-sentinel-green flex items-center gap-1.5">
                        <span className="w-1.5 h-1.5 bg-sentinel-green rounded-full blink"></span> STREAMING
                      </span>
                    </div>
                    <div className="divide-y divide-border-subtle/50 font-mono text-xs">
                      {threatEvents.map(ev => (
                        <div key={ev.id} className="grid grid-cols-12 px-4 py-3 hover:bg-bg-hover items-center">
                          <span className="col-span-2 text-text-muted text-[11px]">{ev.timestamp}</span>
                          <span className="col-span-2"><StatusBadge status={ev.severity} /></span>
                          <span className="col-span-5 text-text-secondary">{ev.event}</span>
                          <span className="col-span-2 text-text-muted text-[11px] truncate">{ev.target}</span>
                          <span className="col-span-1 text-right text-text-muted text-[10px]">{ev.status}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* PAGE 2: THREAT ANALYZER */}
              {page === 'analyzer' && (
                <div className="flex flex-col gap-5">
                  <div>
                    <div className="label-section mb-1">Threat Analyzer</div>
                    <h1 className="font-mono text-lg font-semibold text-text-primary">Inspect Suspicious Digital Artifacts</h1>
                  </div>

                  {/* Analysis Input Panel */}
                  <div className="panel">
                    <div className="flex border-b border-border-subtle font-mono text-xs">
                      {['URL', 'MESSAGE', 'IP', 'FILE'].map(t => (
                        <button
                          key={t}
                          onClick={() => setAnalyzerTab(t)}
                          className={`px-5 py-3 border-b-2 uppercase tracking-wider ${
                            analyzerTab === t ? 'border-sentinel-red text-text-primary bg-bg-surface font-medium' : 'border-transparent text-text-muted hover:text-text-secondary'
                          }`}
                        >
                          {t}
                        </button>
                      ))}
                    </div>
                    <div className="p-4 flex flex-col gap-4">
                      <textarea
                        value={analyzerInput}
                        onChange={e => setAnalyzerInput(e.target.value)}
                        placeholder={
                          analyzerTab === 'URL' ? 'Paste suspicious URL (e.g. https://example-login.com/auth)' :
                          analyzerTab === 'MESSAGE' ? 'Paste suspicious email or message body...' :
                          analyzerTab === 'IP' ? 'Enter IP address (e.g. 185.220.101.47)' :
                          'Enter file hash or drag file...'
                        }
                        className="input-field h-24 resize-none"
                      />
                      <div className="flex justify-between items-center">
                        <span className="font-mono text-[10px] text-text-muted">Target ready for deep inspection</span>
                        <button
                          onClick={runAnalysis}
                          disabled={analyzerState === 'analyzing'}
                          className="btn-primary flex items-center gap-2"
                        >
                          {analyzerState === 'analyzing' ? 'SCANNING ARTIFACT...' : 'RUN ANALYSIS'}
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* Analysis Results Display */}
                  {(analyzerState === 'analyzing' || analyzerState === 'done') && (
                    <div className="flex flex-col gap-5">
                      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
                        {/* Radial Risk Score */}
                        <div className="panel p-5 flex flex-col items-center justify-center text-center">
                          <div className="relative w-36 h-36 flex items-center justify-center my-2">
                            <svg className="w-full h-full rotate-[-90deg]">
                              <circle cx="72" cy="72" r="54" fill="none" stroke="#1e2330" strokeWidth="8"/>
                              <circle cx="72" cy="72" r="54" fill="none" stroke="#ef4444" strokeWidth="8" strokeDasharray="339" strokeDashoffset="44" strokeLinecap="round"/>
                            </svg>
                            <div className="absolute inset-0 flex flex-col items-center justify-center">
                              <span className="font-mono text-4xl font-bold text-sentinel-red">87</span>
                              <span className="font-mono text-[10px] text-text-muted">/ 100</span>
                            </div>
                          </div>
                          <span className="font-mono text-sm font-semibold text-sentinel-red tracking-wider mt-2">HIGH RISK</span>
                          <span className="font-mono text-xs text-text-muted mt-1">Confidence: 94.2% · ID: SX-8F21A9</span>
                          <span className="font-mono text-[11px] text-text-secondary bg-bg-surface px-3 py-1 border border-border-subtle rounded mt-3 truncate max-w-full">
                            {analysisTarget}
                          </span>
                        </div>

                        {/* Pipeline Timeline */}
                        <div className="panel p-5 lg:col-span-2">
                          <div className="label-section mb-4">Analysis Pipeline Timeline</div>
                          <div className="flex flex-col gap-3 font-mono text-xs">
                            {timelineSteps.map(st => (
                              <div key={st.id} className="flex items-center gap-3">
                                <span className="w-5 h-5 rounded-full bg-green-950/40 border border-green-500/40 text-green-400 text-[10px] flex items-center justify-center">✓</span>
                                <span className="font-medium text-text-primary">{st.label}</span>
                                <span className="text-text-muted text-[11px]">— {st.sublabel}</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>

                      {/* Evidence Panel */}
                      <div className="panel p-5">
                        <div className="label-section mb-4">WHY WAS THIS FLAGGED? (Evidence Panel)</div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          {defaultEvidence.map(item => (
                            <div key={item.id} className="panel-surface p-4 flex flex-col gap-2">
                              <div className="flex justify-between items-center">
                                <span className="font-mono text-xs font-semibold text-text-primary">{item.id}. {item.type}</span>
                                <span className="font-mono text-xs font-bold text-sentinel-red">+{item.contrib}</span>
                              </div>
                              <p className="font-mono text-xs text-text-secondary">{item.description}</p>
                              <p className="font-mono text-[10px] text-text-muted">{item.detail}</p>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* PAGE 3: ALERT CENTER */}
              {page === 'alerts' && (
                <div className="flex flex-col gap-5">
                  <div className="flex justify-between items-end">
                    <div>
                      <div className="label-section mb-1">Alert Center</div>
                      <h1 className="font-mono text-lg font-semibold text-text-primary">Active Security Alerts</h1>
                    </div>
                    <div className="flex gap-2 font-mono text-xs">
                      {['ALL', 'HIGH', 'SUSPICIOUS', 'RESOLVED'].map(f => (
                        <button
                          key={f}
                          onClick={() => setAlertFilter(f)}
                          className={`px-3 py-1.5 rounded border ${alertFilter === f ? 'bg-bg-hover text-text-primary border-border-default' : 'text-text-muted border-transparent'}`}
                        >
                          {f}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="panel">
                    <div className="p-3 border-b border-border-subtle">
                      <input
                        type="text"
                        value={alertSearch}
                        onChange={e => setAlertSearch(e.target.value)}
                        placeholder="Search alerts by target or detection..."
                        className="input-field text-xs h-8"
                      />
                    </div>
                    <div className="divide-y divide-border-subtle font-mono text-xs">
                      {alertsList
                        .filter(a => alertFilter === 'ALL' || a.severity === alertFilter || a.status === alertFilter)
                        .filter(a => !alertSearch || a.target.toLowerCase().includes(alertSearch.toLowerCase()) || a.detection.toLowerCase().includes(alertSearch.toLowerCase()))
                        .map(a => (
                          <div key={a.id} className="grid grid-cols-12 px-4 py-3 hover:bg-bg-hover items-center">
                            <span className="col-span-2"><StatusBadge status={a.severity} /></span>
                            <span className="col-span-2 text-sentinel-accent">{a.id}</span>
                            <span className="col-span-4 text-text-secondary">{a.detection}</span>
                            <span className="col-span-2 text-text-muted truncate">{a.target}</span>
                            <span className="col-span-1 text-text-muted text-[10px]">{a.timeAgo}</span>
                            <span className="col-span-1 text-right font-semibold text-sentinel-red">{a.riskScore}</span>
                          </div>
                        ))}
                    </div>
                  </div>
                </div>
              )}

              {/* PAGE 4: ACTIVITY */}
              {page === 'activity' && (
                <div className="flex flex-col gap-5">
                  <div>
                    <div className="label-section mb-1">Activity Log</div>
                    <h1 className="font-mono text-lg font-semibold text-text-primary">Analyst Activity</h1>
                  </div>

                  <div className="panel">
                    <div className="divide-y divide-border-subtle font-mono text-xs">
                      {activityRecords.map(r => (
                        <div key={r.id} className="grid grid-cols-12 px-4 py-3 hover:bg-bg-hover items-center">
                          <span className="col-span-2 text-text-muted">{r.timestamp}</span>
                          <span className="col-span-2 text-sentinel-accent">{r.id}</span>
                          <span className="col-span-2 text-text-secondary">{r.analyst}</span>
                          <span className="col-span-3 text-text-secondary truncate">{r.target}</span>
                          <span className="col-span-2"><StatusBadge status={r.severity} /></span>
                          <span className="col-span-1 text-right text-text-muted text-[10px]">{r.action}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* PAGE 5: INVESTIGATION */}
              {page === 'investigation' && (
                <div className="flex flex-col gap-5 h-full">
                  <div>
                    <div className="label-section mb-1">Investigation</div>
                    <h1 className="font-mono text-lg font-semibold text-text-primary">Threat Relationship Graph</h1>
                  </div>

                  <div className="panel p-6 flex-1 flex flex-col items-center justify-center min-h-[420px] relative overflow-hidden bg-bg-base">
                    {/* SVG Threat Node Graph */}
                    <svg className="w-full h-96" viewBox="0 0 600 320">
                      {/* Edges */}
                      <line x1="300" y1="50" x2="150" y2="140" stroke="#252b3a" strokeWidth="2" />
                      <line x1="300" y1="50" x2="300" y2="140" stroke="#252b3a" strokeWidth="2" />
                      <line x1="300" y1="50" x2="450" y2="140" stroke="#252b3a" strokeWidth="2" />
                      <line x1="150" y1="140" x2="300" y2="240" stroke="#ef4444" strokeWidth="1.5" strokeDasharray="4" />
                      <line x1="300" y1="140" x2="300" y2="240" stroke="#ef4444" strokeWidth="1.5" strokeDasharray="4" />
                      <line x1="450" y1="140" x2="300" y2="240" stroke="#ef4444" strokeWidth="1.5" strokeDasharray="4" />

                      {/* Nodes */}
                      <g transform="translate(240, 30)">
                        <rect width="120" height="40" rx="3" fill="#141720" stroke="#ef4444" strokeWidth="1.5"/>
                        <text x="60" y="18" fill="#ef4444" fontSize="10" fontFamily="JetBrains Mono" textAnchor="middle" fontWeight="bold">TARGET</text>
                        <text x="60" y="30" fill="#e2e8f0" fontSize="9" fontFamily="JetBrains Mono" textAnchor="middle">example-login.com</text>
                      </g>

                      <g transform="translate(90, 120)">
                        <rect width="120" height="40" rx="3" fill="#141720" stroke="#ef4444" strokeWidth="1.5"/>
                        <text x="60" y="18" fill="#ef4444" fontSize="10" fontFamily="JetBrains Mono" textAnchor="middle" fontWeight="bold">DOMAIN</text>
                        <text x="60" y="30" fill="#94a3b8" fontSize="9" fontFamily="JetBrains Mono" textAnchor="middle">Age: 2d</text>
                      </g>

                      <g transform="translate(240, 120)">
                        <rect width="120" height="40" rx="3" fill="#141720" stroke="#f97316" strokeWidth="1.5"/>
                        <text x="60" y="18" fill="#f97316" fontSize="10" fontFamily="JetBrains Mono" textAnchor="middle" fontWeight="bold">URL ENTROPY</text>
                        <text x="60" y="30" fill="#94a3b8" fontSize="9" fontFamily="JetBrains Mono" textAnchor="middle">4.8 bits</text>
                      </g>

                      <g transform="translate(390, 120)">
                        <rect width="120" height="40" rx="3" fill="#141720" stroke="#ef4444" strokeWidth="1.5"/>
                        <text x="60" y="18" fill="#ef4444" fontSize="10" fontFamily="JetBrains Mono" textAnchor="middle" fontWeight="bold">IP ADDRESS</text>
                        <text x="60" y="30" fill="#94a3b8" fontSize="9" fontFamily="JetBrains Mono" textAnchor="middle">185.220.101.47</text>
                      </g>

                      <g transform="translate(240, 220)">
                        <rect width="120" height="45" rx="3" fill="#0f1117" stroke="#ef4444" strokeWidth="2"/>
                        <text x="60" y="18" fill="#ef4444" fontSize="11" fontFamily="JetBrains Mono" textAnchor="middle" fontWeight="bold">RISK SCORE</text>
                        <text x="60" y="34" fill="#ef4444" fontSize="13" fontFamily="JetBrains Mono" textAnchor="middle" fontWeight="bold">87 / 100</text>
                      </g>
                    </svg>
                  </div>
                </div>
              )}

              {/* PAGE 6: REPORTS */}
              {page === 'reports' && (
                <div className="flex flex-col gap-5">
                  <div className="flex justify-between items-center">
                    <div>
                      <div className="label-section mb-1">Reports</div>
                      <h1 className="font-mono text-lg font-semibold text-text-primary">Threat Analysis Report</h1>
                    </div>
                    <button onClick={exportReport} className="btn-primary">
                      EXPORT REPORT (.TXT)
                    </button>
                  </div>

                  <div className="panel p-6 font-mono text-xs flex flex-col gap-4">
                    <div className="border-b border-border-subtle pb-4">
                      <div className="text-text-muted mb-1">SUMMARY</div>
                      <div className="text-base text-text-primary font-semibold">TARGET: {analysisTarget}</div>
                      <div className="text-sentinel-red text-sm font-bold mt-1">RISK SCORE: 87/100 (HIGH RISK)</div>
                    </div>

                    <div>
                      <div className="label-section mb-2">RECOMMENDED ACTIONS</div>
                      <ol className="list-decimal list-inside text-text-secondary space-y-1">
                        <li>Block all perimeter traffic to domain.</li>
                        <li>Inspect internal hosts with active connections.</li>
                        <li>Reset user credentials for affected accounts.</li>
                        <li>Submit domain for registrar takedown.</li>
                      </ol>
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
