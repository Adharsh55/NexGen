<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SENTINEL-X | AI Cybersecurity Threat Analysis Platform</title>
  
  <!-- Premium Google Fonts: Outfit, Plus Jakarta Sans, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bg-obsidian': '#050609',
            'bg-panel': '#0b0d14',
            'bg-surface': '#111420',
            'bg-hover': '#171b2b',
            'border-subtle': '#1a1f30',
            'border-highlight': '#2a334e',
            'text-primary': '#f8fafc',
            'text-secondary': '#94a3b8',
            'text-muted': '#475569',
            'sentinel-green': '#10b981',
            'sentinel-cyan': '#06b6d4',
            'sentinel-rose': '#f43f5e',
            'sentinel-amber': '#f59e0b',
            'sentinel-violet': '#a855f7',
          },
          fontFamily: {
            sans: ['Outfit', 'Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Premium Styles for Ultra Cyber Background & Laser Beam Animations -->
  <style>
    body {
      background-color: #050609;
      color: #f8fafc;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      margin: 0;
      height: 100vh;
      position: relative;
    }

    /* MULTI-TONE HIGH-TECH CYBER KINETIC BACKGROUND GRID */
    .cyber-master-bg {
      background-color: #050609;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(6, 182, 212, 0.2) 0%, transparent 60%),
        radial-gradient(circle at 10% 80%, rgba(168, 85, 247, 0.14) 0%, transparent 50%),
        radial-gradient(circle at 90% 85%, rgba(16, 185, 129, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 85% 15%, rgba(244, 63, 94, 0.12) 0%, transparent 50%),
        linear-gradient(to right, rgba(26, 31, 48, 0.35) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(26, 31, 48, 0.35) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 36px 36px, 36px 36px;
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #050609; }
    ::-webkit-scrollbar-thumb { background: #1a1f30; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #2a334e; }

    .glass-panel {
      background: rgba(11, 13, 20, 0.88);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 16px;
      box-shadow: 
        0 0 50px rgba(6, 182, 212, 0.12),
        0 0 20px rgba(168, 85, 247, 0.08),
        inset 0 0 30px rgba(6, 182, 212, 0.04);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-panel:hover {
      border-color: rgba(6, 182, 212, 0.5);
      box-shadow: 
        0 0 65px rgba(6, 182, 212, 0.22),
        0 0 25px rgba(168, 85, 247, 0.15),
        inset 0 0 40px rgba(6, 182, 212, 0.08);
    }

    .glass-surface {
      background: rgba(17, 20, 32, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(42, 51, 78, 0.8);
      border-radius: 12px;
    }

    .glow-cyan {
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.35);
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.5; }
    }
    .pulse-glow { animation: pulseGlow 2s infinite ease-in-out; }

    @keyframes laserSweep {
      0% { transform: translateY(-100%); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(100vh); opacity: 0; }
    }
    .laser-beam {
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(to right, transparent, rgba(6, 182, 212, 0.6), rgba(168, 85, 247, 0.6), transparent);
      animation: laserSweep 8s ease-in-out infinite;
      pointer-events: none;
    }
  </style>

  <!-- React & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="cyber-master-bg flex flex-col h-screen w-screen overflow-hidden">
  
  <!-- Ambient Laser Sweep Effect -->
  <div class="laser-beam"></div>

  <!-- Animated Floating Cyber Particle Nodes SVG Background -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden opacity-35 z-0">
    <svg class="w-full h-full" viewBox="0 0 1000 600" preserveAspectRatio="none">
      <line x1="80" y1="100" x2="250" y2="220" stroke="#06b6d4" strokeWidth="1" strokeDasharray="4 4" opacity="0.6"/>
      <line x1="920" y1="120" x2="750" y2="240" stroke="#a855f7" strokeWidth="1" strokeDasharray="4 4" opacity="0.6"/>
      <line x1="150" y1="480" x2="320" y2="380" stroke="#10b981" strokeWidth="1" strokeDasharray="4 4" opacity="0.6"/>
      <line x1="850" y1="480" x2="680" y2="380" stroke="#f43f5e" strokeWidth="1" strokeDasharray="4 4" opacity="0.6"/>

      <circle cx="80" cy="100" r="4" fill="#06b6d4" />
      <circle cx="920" cy="120" r="4" fill="#a855f7" />
      <circle cx="150" cy="480" r="4" fill="#10b981" />
      <circle cx="850" cy="480" r="4" fill="#f43f5e" />
    </svg>
  </div>

  <div id="root" class="relative z-10 flex flex-col h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- ICONS ---
    const IconShield = ({ size=20, className="" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/>
      </svg>
    );
    const IconMessage = ({ size=18 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    );
    const IconImage = ({ size=18 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    );
    const IconHistory = ({ size=18 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    );
    const IconLock = ({ size=16 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    );
    const IconUpload = ({ size=24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    );
    const IconSparkles = ({ size=16 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
    );
    const IconAlertTriangle = ({ size=18 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    );

    const sampleMessages = [
      {
        label: "Phishing SMS",
        text: "URGENT: Your online banking account has been temporarily locked due to unauthorized login attempts. Verify identity immediately at: http://secure-update-verify.com"
      },
      {
        label: "Credential Harvest",
        text: "Security Alert: Someone attempted to reset your Microsoft 365 password. Confirm credentials here: http://m365-auth-login.net/verify"
      },
      {
        label: "Legitimate Message",
        text: "Hi Alex, your scheduled security review meeting is set for tomorrow at 10:00 AM UTC in Room 4B. The slide deck is uploaded to our internal server."
      }
    ];

    const recentLogs = [
      { id: 'SCAN-9041', type: 'MESSAGE', target: 'URGENT: Your online banking account has been locked...', status: 'CRITICAL THREAT', score: 94, time: '2 mins ago' },
      { id: 'SCAN-9040', type: 'IMAGE', target: 'passport_scan_verified.png', status: 'DEEPFAKE DETECTED', score: 91, time: '8 mins ago' },
      { id: 'SCAN-9039', type: 'MESSAGE', target: 'Hi Alex, your scheduled security review meeting is...', status: 'SAFE PASS', score: 6, time: '14 mins ago' },
      { id: 'SCAN-9038', type: 'IMAGE', target: 'profile_photo_identity.jpg', status: 'SUSPICIOUS EXIF', score: 68, time: '22 mins ago' },
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('message');
      const [time, setTime] = useState(new Date());

      // MESSAGE CHECKER STATE
      const [messageInput, setMessageInput] = useState(sampleMessages[0].text);
      const [messageScanning, setMessageScanning] = useState(false);
      const [messageResult, setMessageResult] = useState(null);

      // IMAGE CHECKER STATE
      const [selectedImage, setSelectedImage] = useState(null);
      const [imagePreview, setImagePreview] = useState(null);
      const [imageScanning, setImageScanning] = useState(false);
      const [imageResult, setImageResult] = useState(null);

      useEffect(() => {
        const timer = setInterval(() => setTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      // REAL DATASET BACKEND SCAN FUNCTION
      const runMessageScan = async (customText) => {
        const textToScan = customText !== undefined ? customText : messageInput;
        if (!textToScan.trim()) return;
        setMessageScanning(true);
        setMessageResult(null);

        try {
          const response = await fetch('http://localhost:5000/api/analyze-email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: textToScan })
          });

          const data = await response.json();
          setMessageScanning(false);

          if (response.ok) {
            const risk = data.riskPercentage;
            const isCritical = risk >= 70;
            const isSuspicious = risk >= 40 && risk < 70;

            setMessageResult({
              score: risk,
              severity: data.classification,
              confidence: `${risk}% Dataset Probability`,
              statusColor: isCritical ? 'text-sentinel-rose' : (isSuspicious ? 'text-sentinel-amber' : 'text-sentinel-green'),
              bgBorder: isCritical ? 'border-sentinel-rose/30 bg-rose-950/20' : (isSuspicious ? 'border-sentinel-amber/30 bg-amber-950/20' : 'border-sentinel-green/30 bg-emerald-950/20'),
              findings: data.indicators.map((ind, i) => ({
                title: `Dataset Indicator #${i+1}`,
                desc: ind,
                contrib: Math.round(risk / data.indicators.length)
              })),
              recommendation: isCritical 
                ? 'BLOCK & QUARANTINE: High probability match with trained phishing dataset signatures.' 
                : 'Message passed dataset filters safely.'
            });
          } else {
            alert(`Analysis failed: ${data.message}`);
          }
        } catch (err) {
          setMessageScanning(false);
          alert('ERROR: Python backend offline or unreachable.');
        }
      };

      const handleImageSelect = (e) => {
        const file = e.target.files[0];
        if (file) {
          setSelectedImage(file);
          setImagePreview(URL.createObjectURL(file));
          setImageResult(null);
        }
      };

      const runImageScan = () => {
        if (!imagePreview) return;
        setImageScanning(true);
        setImageResult(null);

        setTimeout(() => {
          setImageScanning(false);
          setImageResult({
            score: 91,
            severity: 'AI DEEPFAKE DETECTED',
            confidence: '96.4%',
            metadata: {
              resolution: '1920 x 1080 px',
              format: 'JPEG Image',
              exifState: 'Stripped / Modified',
              steganography: 'Clean Payload'
            },
            findings: [
              { title: 'NEURAL MESH INCONSISTENCY', desc: 'Diffusion artifacts detected in facial border pixels and iris illumination symmetry.', contrib: 42 },
              { title: 'EXIF METADATA STRIPPED', desc: 'Original camera hardware metadata removed, indicating artificial generation.', contrib: 28 },
              { title: 'GAUSSIAN NOISE ANOMALY', desc: 'Unnatural frequency distribution characteristic of AI diffusion models.', contrib: 21 }
            ],
            recommendation: 'REJECT CONTENT: High probability of synthetic AI deepfake manipulation.'
          });
        }, 2000);
      };

      return (
        <div className="flex flex-col h-full w-full">
          
          {/* HEADER BAR */}
          <header className="h-16 bg-bg-panel/90 backdrop-blur-xl border-b border-border-subtle grid grid-cols-3 items-center px-8 shrink-0 z-30">
            <div className="flex items-center gap-3">
              <span className="w-2 h-2 rounded-full bg-sentinel-cyan pulse-glow"></span>
              <span className="font-mono text-xs text-text-secondary tracking-widest uppercase font-semibold">SOC AI SENTINEL PLATFORM</span>
            </div>

            <div className="flex justify-center">
              <div className="flex items-center gap-3 cursor-pointer">
                <div className="p-2 rounded-xl bg-cyan-950/60 border border-sentinel-cyan/50 text-sentinel-cyan glow-cyan">
                  <IconShield size={22} />
                </div>
                <div className="flex flex-col">
                  <span className="text-xl font-extrabold tracking-widest text-text-primary uppercase leading-none">
                    SENTINEL<span className="text-sentinel-cyan">-X</span>
                  </span>
                  <span className="font-mono text-[9px] text-text-muted tracking-widest uppercase">
                    CYBER THREAT WORKSTATION
                  </span>
                </div>
              </div>
            </div>

            <div className="flex items-center justify-end gap-5 font-mono text-xs">
              <div className="flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-950/50 border border-emerald-500/40 text-sentinel-green font-bold">
                <span className="w-2 h-2 rounded-full bg-sentinel-green pulse-glow"></span>
                <span>AI ENGINE LIVE</span>
              </div>
              
              <div className="h-4 w-px bg-border-subtle"></div>
              
              <div className="text-text-secondary">
                {time.toLocaleTimeString('en-US', { hour12: false })}
              </div>

              <a 
                href="login.html" 
                title="Go to Separate Login Page"
                className="flex items-center gap-2 bg-bg-surface hover:bg-cyan-950/50 border border-border-highlight hover:border-sentinel-cyan text-text-primary px-3.5 py-1.5 rounded-xl transition-all font-bold"
              >
                <IconLock size={14} className="text-sentinel-cyan" />
                <span>LOGIN</span>
              </a>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="flex-1 overflow-y-auto p-8 pb-16 no-scrollbar">

            {/* CENTERED NAVIGATION TAB BAR */}
            <div className="flex justify-center mb-8 max-w-xl mx-auto">
              <nav className="flex items-center gap-2 bg-bg-panel/95 backdrop-blur-xl p-2 rounded-2xl border border-border-highlight shadow-2xl">
                <button
                  onClick={() => setActiveTab('message')}
                  className={`flex items-center gap-2.5 px-6 py-3 rounded-xl font-semibold text-xs tracking-wider uppercase transition-all ${
                    activeTab === 'message'
                      ? 'text-bg-obsidian bg-sentinel-cyan font-bold shadow-lg glow-cyan'
                      : 'text-text-secondary hover:text-text-primary hover:bg-bg-hover'
                  }`}
                >
                  <IconMessage size={18} />
                  <span>Message Checker</span>
                </button>

                <button
                  onClick={() => setActiveTab('image')}
                  className={`flex items-center gap-2.5 px-6 py-3 rounded-xl font-semibold text-xs tracking-wider uppercase transition-all ${
                    activeTab === 'image'
                      ? 'text-bg-obsidian bg-sentinel-cyan font-bold shadow-lg glow-cyan'
                      : 'text-text-secondary hover:text-text-primary hover:bg-bg-hover'
                  }`}
                >
                  <IconImage size={18} />
                  <span>Image Checker</span>
                </button>

                <button
                  onClick={() => setActiveTab('history')}
                  className={`flex items-center gap-2.5 px-5 py-3 rounded-xl font-semibold text-xs tracking-wider uppercase transition-all ${
                    activeTab === 'history'
                      ? 'text-bg-obsidian bg-sentinel-cyan font-bold shadow-lg glow-cyan'
                      : 'text-text-secondary hover:text-text-primary hover:bg-bg-hover'
                  }`}
                >
                  <IconHistory size={18} />
                  <span>Log</span>
                </button>
              </nav>
            </div>

            {/* TAB 1: MESSAGE CHECKER */}
            {activeTab === 'message' && (
              <div className="flex flex-col gap-6 max-w-4xl mx-auto">
                <div className="glass-panel p-8 flex flex-col gap-5">
                  <div className="flex justify-between items-start">
                    <div>
                      <div className="font-mono text-xs text-sentinel-cyan font-bold uppercase tracking-wider mb-1">
                        DATASET PHISHING & SPAM ENGINE
                      </div>
                      <h2 className="text-xl font-bold text-text-primary">Inspect Suspicious Message</h2>
                    </div>

                    <div className="flex items-center gap-2">
                      <span className="font-mono text-xs text-text-muted">DEMO PRESETS:</span>
                      <div className="flex gap-1.5">
                        {sampleMessages.map((sm, i) => (
                          <button
                            key={i}
                            onClick={() => {
                              setMessageInput(sm.text);
                              runMessageScan(sm.text);
                            }}
                            className="px-3 py-1 rounded-lg bg-bg-surface hover:bg-bg-hover border border-border-subtle text-xs text-text-secondary hover:text-text-primary font-mono transition-all"
                          >
                            Preset {i+1}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  <textarea
                    value={messageInput}
                    onChange={e => setMessageInput(e.target.value)}
                    placeholder="Paste suspicious email body, SMS text, or chat content..."
                    className="w-full bg-bg-surface border border-border-highlight text-text-primary font-mono text-sm p-4 rounded-xl outline-none focus:border-sentinel-cyan transition-all h-36 resize-none"
                  />

                  <div className="flex justify-between items-center pt-2">
                    <span className="font-mono text-xs text-text-muted">
                      {messageInput.length} characters ready for dataset scoring
                    </span>
                    
                    <button
                      onClick={() => runMessageScan()}
                      disabled={messageScanning || !messageInput.trim()}
                      className="bg-sentinel-cyan hover:bg-cyan-400 text-bg-obsidian font-bold text-xs uppercase tracking-wider px-7 py-3.5 rounded-xl glow-cyan transition-all flex items-center gap-2"
                    >
                      {messageScanning ? (
                        <>
                          <span className="w-2.5 h-2.5 rounded-full bg-bg-obsidian pulse-glow"></span>
                          <span>ANALYZING DATASET...</span>
                        </>
                      ) : (
                        <>
                          <IconSparkles size={16} />
                          <span>RUN THREAT ANALYSIS</span>
                        </>
                      )}
                    </button>
                  </div>
                </div>

                {/* RESULTS DISPLAY */}
                {messageResult && (
                  <div className="flex flex-col gap-6">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      
                      <div className="glass-panel p-6 flex flex-col items-center justify-center text-center">
                        <div className="relative w-36 h-36 flex items-center justify-center my-2">
                          <svg className="w-full h-full rotate-[-90deg]">
                            <circle cx="72" cy="72" r="54" fill="none" stroke="#1a1f30" strokeWidth="8"/>
                            <circle 
                              cx="72" cy="72" r="54" fill="none" 
                              stroke={messageResult.score > 50 ? "#f43f5e" : "#10b981"} 
                              strokeWidth="8" 
                              strokeDasharray="339" 
                              strokeDashoffset={339 - (339 * messageResult.score) / 100} 
                              strokeLinecap="round"
                            />
                          </svg>
                          <div className="absolute inset-0 flex flex-col items-center justify-center">
                            <span className={`font-mono text-4xl font-extrabold ${messageResult.statusColor}`}>
                              {messageResult.score}%
                            </span>
                            <span className="font-mono text-[10px] text-text-muted">RISK LEVEL</span>
                          </div>
                        </div>

                        <span className={`font-mono text-sm font-bold tracking-widest uppercase mt-2 ${messageResult.statusColor}`}>
                          {messageResult.severity}
                        </span>
                        <span className="font-mono text-xs text-text-muted mt-1">Confidence: {messageResult.confidence}</span>
                      </div>

                      <div className="glass-panel p-6 md:col-span-2 flex flex-col gap-4">
                        <div className="font-mono text-xs text-text-secondary font-bold uppercase tracking-wider">
                          DATASET CLASSIFICATION & HEURISTIC SIGNATURES
                        </div>
                        
                        <div className="flex flex-col gap-3">
                          {messageResult.findings.map((item, idx) => (
                            <div key={idx} className="glass-surface p-4 flex flex-col gap-1">
                              <div className="flex justify-between items-center">
                                <span className="font-bold text-text-primary text-sm">{idx+1}. {item.title}</span>
                              </div>
                              <p className="text-xs text-text-secondary leading-relaxed">{item.desc}</p>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>

                    <div className={`p-5 rounded-2xl border ${messageResult.bgBorder} flex items-start gap-4`}>
                      <div className="p-2 rounded-xl bg-rose-950/50 text-sentinel-rose shrink-0 mt-0.5">
                        <IconAlertTriangle size={20} />
                      </div>
                      <div>
                        <div className="font-mono text-xs font-bold text-sentinel-rose uppercase tracking-wider mb-1">
                          RECOMMENDED SOC ACTION
                        </div>
                        <p className="text-sm font-medium text-text-primary leading-relaxed">{messageResult.recommendation}</p>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* TAB 2: IMAGE CHECKER */}
            {activeTab === 'image' && (
              <div className="flex flex-col gap-6 max-w-4xl mx-auto">
                <div className="glass-panel p-8 flex flex-col gap-5">
                  <div>
                    <div className="font-mono text-xs text-sentinel-cyan font-bold uppercase tracking-wider mb-1">
                      DEEPFAKE & STEGANOGRAPHY HEURISTIC ENGINE
                    </div>
                    <h2 className="text-xl font-bold text-text-primary">Inspect Digital Image & Media</h2>
                  </div>

                  <div className="relative border-2 border-dashed border-border-highlight hover:border-sentinel-cyan/60 rounded-2xl p-8 flex flex-col items-center justify-center text-center cursor-pointer bg-bg-surface/50 transition-all">
                    <input 
                      type="file" 
                      accept="image/*"
                      onChange={handleImageSelect}
                      className="absolute inset-0 opacity-0 cursor-pointer w-full h-full" 
                    />
                    
                    {imagePreview ? (
                      <div className="flex flex-col items-center gap-3">
                        <img src={imagePreview} alt="Uploaded preview" className="max-h-52 rounded-xl border border-border-highlight object-contain shadow-xl" />
                        <span className="font-mono text-xs text-sentinel-cyan font-semibold">Click or drag another image to replace</span>
                      </div>
                    ) : (
                      <div className="flex flex-col items-center gap-3 py-6">
                        <div className="p-4 rounded-2xl bg-cyan-950/50 text-sentinel-cyan border border-cyan-500/30 glow-cyan">
                          <IconUpload size={28} />
                        </div>
                        <div>
                          <div className="font-semibold text-text-primary text-base mb-1">Drag & Drop Image File Here</div>
                          <div className="font-mono text-xs text-text-muted">Supports PNG, JPG, WEBP, GIF (Up to 25MB)</div>
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="flex justify-between items-center pt-2">
                    <span className="font-mono text-xs text-text-muted">
                      {selectedImage ? `File: ${selectedImage.name} (${(selectedImage.size/1024).toFixed(1)} KB)` : 'Ready for upload'}
                    </span>

                    <button
                      onClick={runImageScan}
                      disabled={imageScanning || !imagePreview}
                      className="bg-sentinel-cyan hover:bg-cyan-400 text-bg-obsidian font-bold text-xs uppercase tracking-wider px-7 py-3.5 rounded-xl glow-cyan transition-all flex items-center gap-2"
                    >
                      {imageScanning ? (
                        <>
                          <span className="w-2.5 h-2.5 rounded-full bg-bg-obsidian pulse-glow"></span>
                          <span>ANALYZING MEDIA...</span>
                        </>
                      ) : (
                        <>
                          <IconSparkles size={16} />
                          <span>RUN DEEPFAKE SCAN</span>
                        </>
                      )}
                    </button>
                  </div>
                </div>

                {imageResult && (
                  <div className="flex flex-col gap-6">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      
                      <div className="glass-panel p-6 flex flex-col items-center justify-center text-center">
                        <div className="relative w-36 h-36 flex items-center justify-center my-2">
                          <svg className="w-full h-full rotate-[-90deg]">
                            <circle cx="72" cy="72" r="54" fill="none" stroke="#1a1f30" strokeWidth="8"/>
                            <circle cx="72" cy="72" r="54" fill="none" stroke="#f43f5e" strokeWidth="8" strokeDasharray="339" strokeDashoffset="30" strokeLinecap="round"/>
                          </svg>
                          <div className="absolute inset-0 flex flex-col items-center justify-center">
                            <span className="font-mono text-4xl font-extrabold text-sentinel-rose">{imageResult.score}%</span>
                            <span className="font-mono text-[9px] text-text-muted uppercase tracking-wider">AI PROBABILITY</span>
                          </div>
                        </div>

                        <span className="font-mono text-xs font-bold text-sentinel-rose tracking-wider uppercase mt-2">
                          {imageResult.severity}
                        </span>
                        <span className="font-mono text-xs text-text-muted mt-1">Confidence: {imageResult.confidence}</span>
                      </div>

                      <div className="glass-panel p-6 md:col-span-2 flex flex-col gap-4">
                        <div className="font-mono text-xs text-text-secondary font-bold uppercase tracking-wider">
                          MEDIA FORENSIC ANALYSIS
                        </div>

                        <div className="grid grid-cols-2 gap-3 font-mono text-xs glass-surface p-4">
                          <div><span className="text-text-muted">Resolution:</span> <strong className="text-text-primary">{imageResult.metadata.resolution}</strong></div>
                          <div><span className="text-text-muted">File Format:</span> <strong className="text-text-primary">{imageResult.metadata.format}</strong></div>
                          <div><span className="text-text-muted">EXIF Data:</span> <strong className="text-sentinel-amber">{imageResult.metadata.exifState}</strong></div>
                          <div><span className="text-text-muted">Steganography:</span> <strong className="text-sentinel-green">{imageResult.metadata.steganography}</strong></div>
                        </div>

                        <div className="flex flex-col gap-3">
                          {imageResult.findings.map((item, idx) => (
                            <div key={idx} className="glass-surface p-4 flex flex-col gap-1">
                              <div className="flex justify-between items-center">
                                <span className="font-bold text-text-primary text-sm">{idx+1}. {item.title}</span>
                              </div>
                              <p className="text-xs text-text-secondary leading-relaxed">{item.desc}</p>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* TAB 3: HISTORY LOG */}
            {activeTab === 'history' && (
              <div className="flex flex-col gap-6 max-w-4xl mx-auto">
                <div className="glass-panel p-6">
                  <div className="flex justify-between items-center mb-6">
                    <div>
                      <div className="font-mono text-xs text-sentinel-cyan font-bold uppercase tracking-wider mb-1">
                        INSPECTION AUDIT LOG
                      </div>
                      <h2 className="text-xl font-bold text-text-primary">Recent Scans & Heuristic Results</h2>
                    </div>
                  </div>

                  <div className="divide-y divide-border-subtle font-mono text-xs">
                    {recentLogs.map(log => (
                      <div key={log.id} className="grid grid-cols-12 px-4 py-4 hover:bg-bg-hover/50 transition-colors items-center">
                        <span className="col-span-2 text-text-muted">{log.time}</span>
                        <span className="col-span-2 text-sentinel-cyan font-bold">{log.id}</span>
                        <span className="col-span-2">
                          <span className={`text-[10px] px-2.5 py-1 rounded font-bold border ${
                            log.type === 'MESSAGE' 
                              ? 'bg-cyan-950/50 text-sentinel-cyan border-cyan-500/40' 
                              : 'bg-violet-950/50 text-sentinel-violet border-violet-500/40'
                          }`}>
                            {log.type}
                          </span>
                        </span>
                        <span className="col-span-4 text-text-secondary truncate font-sans">{log.target}</span>
                        <span className="col-span-2 text-right font-bold text-sentinel-rose">{log.status} ({log.score}%)</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* FOOTER BAR */}
          <footer className="h-11 bg-bg-panel/90 backdrop-blur-xl border-t border-border-subtle px-8 flex items-center justify-between shrink-0 font-mono text-xs text-text-muted z-30">
            <div className="flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-sentinel-green pulse-glow"></span>
              <span>DATASET MODEL STATUS:</span>
              <span className="text-sentinel-green font-bold">LOADED & ACTIVE</span>
            </div>

            <div className="flex items-center gap-8 text-xs">
              <span>MESSAGES ANALYZED: <strong className="text-text-primary">1,284</strong></span>
              <span>CRITICAL THREATS DETECTED: <strong className="text-sentinel-rose">89</strong></span>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
