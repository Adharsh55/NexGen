<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SENTINEL-X | SOC Cyber Command Login</title>
  
  <!-- Premium Google Fonts: Outfit, Plus Jakarta Sans, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bg-obsidian': '#050609',
            'bg-panel': '#0b0d14',
            'bg-surface': '#111420',
            'border-subtle': '#1a1f30',
            'border-highlight': '#2a334e',
            'text-primary': '#f8fafc',
            'text-secondary': '#94a3b8',
            'text-muted': '#475569',
            'sentinel-green': '#10b981',
            'sentinel-cyan': '#06b6d4',
            'sentinel-rose': '#f43f5e',
            'sentinel-violet': '#a855f7',
            'sentinel-amber': '#f59e0b',
          },
          fontFamily: {
            sans: ['Outfit', 'Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Custom Styles for Ultra-Futuristic Cyber Aesthetics -->
  <style>
    body {
      background-color: #050609;
      color: #f8fafc;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      margin: 0;
      height: 100vh;
      position: relative;
    }

    /* DYNAMIC CYBER MESH BACKGROUND WITH NEON GRADIENTS */
    .cyber-command-bg {
      background-color: #050609;
      background-image: 
        radial-gradient(circle at 50% 25%, rgba(6, 182, 212, 0.22) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 90% 10%, rgba(244, 63, 94, 0.15) 0%, transparent 50%),
        linear-gradient(to right, rgba(26, 31, 48, 0.4) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(26, 31, 48, 0.4) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 36px 36px, 36px 36px;
    }

    /* HOLOGRAPHIC GLASS CARD */
    .holo-card {
      background: rgba(11, 13, 20, 0.88);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(6, 182, 212, 0.35);
      border-radius: 20px;
      box-shadow: 
        0 0 60px rgba(6, 182, 212, 0.18),
        0 0 20px rgba(168, 85, 247, 0.1),
        inset 0 0 30px rgba(6, 182, 212, 0.05);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .holo-card:hover {
      border-color: rgba(6, 182, 212, 0.6);
      box-shadow: 
        0 0 80px rgba(6, 182, 212, 0.25),
        0 0 30px rgba(168, 85, 247, 0.2),
        inset 0 0 40px rgba(6, 182, 212, 0.08);
    }

    .input-field-cyber {
      background: rgba(17, 20, 32, 0.9);
      border: 1px solid #2a334e;
      color: #f8fafc;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      border-radius: 12px;
      padding: 14px 16px 14px 44px;
      outline: none;
      width: 100%;
      transition: all 0.25s ease;
    }
    .input-field-cyber:focus {
      border-color: #06b6d4;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
      background: rgba(17, 20, 32, 1);
    }

    .btn-cyber-auth {
      background: linear-gradient(135deg, #06b6d4 0%, #0284c7 50%, #3b82f6 100%);
      color: #050609;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      padding: 16px 32px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.5);
      position: relative;
      overflow: hidden;
    }
    .btn-cyber-auth:hover {
      background: linear-gradient(135deg, #22d3ee 0%, #06b6d4 50%, #60a5fa 100%);
      box-shadow: 0 0 45px rgba(6, 182, 212, 0.8), 0 0 15px rgba(168, 85, 247, 0.4);
      transform: translateY(-2px);
    }

    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .radar-ring { animation: radarSpin 10s linear infinite; }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.5; }
    }
    .pulse-glow { animation: pulseGlow 2s infinite ease-in-out; }

    @keyframes laserSweep {
      0% { transform: translateY(-100%); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(100vh); opacity: 0; }
    }
    .laser-beam {
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(to right, transparent, rgba(6, 182, 212, 0.6), rgba(168, 85, 247, 0.6), transparent);
      animation: laserSweep 6s ease-in-out infinite;
      pointer-events: none;
    }
  </style>

  <!-- React & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="cyber-command-bg flex items-center justify-center min-h-screen p-4 relative">
  
  <!-- Laser Sweep Effect -->
  <div class="laser-beam"></div>

  <!-- Animated Floating Cyber Particle Nodes SVG Background -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden opacity-40">
    <svg class="w-full h-full" viewBox="0 0 1000 600" preserveAspectRatio="none">
      <defs>
        <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor="#06b6d4" stopOpacity="0.8" />
          <stop offset="100%" stopColor="#06b6d4" stopOpacity="0" />
        </radialGradient>
      </defs>

      <!-- Connecting Lines -->
      <line x1="120" y1="120" x2="280" y2="240" stroke="#06b6d4" strokeWidth="1" strokeDasharray="3 3" opacity="0.6"/>
      <line x1="880" y1="140" x2="720" y2="260" stroke="#a855f7" strokeWidth="1" strokeDasharray="3 3" opacity="0.6"/>
      <line x1="500" y1="520" x2="500" y2="380" stroke="#10b981" strokeWidth="1" strokeDasharray="3 3" opacity="0.6"/>
      <line x1="200" y1="480" x2="350" y2="380" stroke="#f43f5e" strokeWidth="1" strokeDasharray="3 3" opacity="0.6"/>
      <line x1="800" y1="460" x2="650" y2="380" stroke="#06b6d4" strokeWidth="1" strokeDasharray="3 3" opacity="0.6"/>

      <!-- Glowing Nodes -->
      <circle cx="120" cy="120" r="5" fill="#06b6d4" />
      <circle cx="880" cy="140" r="5" fill="#a855f7" />
      <circle cx="500" cy="520" r="5" fill="#10b981" />
      <circle cx="200" cy="480" r="5" fill="#f43f5e" />
      <circle cx="800" cy="460" r="5" fill="#06b6d4" />
    </svg>
  </div>

  <div id="root" class="w-full flex items-center justify-center z-10"></div>

  <script type="text/babel">
    const { useState } = React;

    const IconShield = ({ size=24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/>
      </svg>
    );

    const IconUser = ({ size=18 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    );

    const IconKey = ({ size=18 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.778-7.778Zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
    );

    const IconFingerprint = ({ size=20 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38-.6 4.41-1.3 5.88"/><path d="M16 11.26A6 6 0 0 0 10 7a5.9 5.9 0 0 0-3.3 1"/><path d="M18 10a8 8 0 0 0-14 3.73"/><path d="M12 2a10 10 0 0 0-9.4 13.4"/><path d="M12 18a2.5 2.5 0 0 0 2.5-2.5c0-.98-.1-2.42-.26-3.86"/></svg>
    );

    function LoginPage() {
      const [email, setEmail] = useState('analyst@sentinel-x.io');
      const [password, setPassword] = useState('••••••••••••');
      const [clearance, setClearance] = useState('Level 3 — Lead Commander');
      const [statusMsg, setStatusMsg] = useState('');

      const handleLogin = (e) => {
        e.preventDefault();
        setStatusMsg('INITIALIZING BIOMETRIC SCAN...');
        setTimeout(() => {
          setStatusMsg('VERIFYING MFA SECURITY TOKEN...');
          setTimeout(() => {
            setStatusMsg('DECRYPTING COMMAND WORKSTATION...');
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 900);
          }, 900);
        }, 900);
      };

      return (
        <div className="w-full max-w-md holo-card p-9 flex flex-col gap-6 relative">
          
          {/* Top Ticker Status Bar */}
          <div className="flex items-center justify-between font-mono text-[10px] text-text-muted border-b border-border-subtle pb-3">
            <span className="flex items-center gap-1.5 text-sentinel-green font-bold">
              <span className="w-1.5 h-1.5 rounded-full bg-sentinel-green pulse-glow"></span> GATEWAY: ONLINE
            </span>
            <span className="text-sentinel-cyan font-semibold">ENCRYPTION: AES-256</span>
            <span className="text-text-muted">NODE: SX-99</span>
          </div>

          {/* Holographic Logo Header */}
          <div className="flex flex-col items-center text-center relative py-2">
            
            {/* Spinning Radar Ring Behind Shield */}
            <div className="relative w-20 h-20 flex items-center justify-center mb-3">
              <div className="absolute inset-0 rounded-full border border-dashed border-sentinel-cyan/40 radar-ring"></div>
              <div className="absolute inset-2 rounded-full border border-sentinel-violet/30"></div>
              <div className="p-4 rounded-2xl bg-cyan-950/70 border border-sentinel-cyan/60 text-sentinel-cyan shadow-xl shadow-cyan-500/30 z-10">
                <IconShield size={32} />
              </div>
            </div>

            <h1 className="text-3xl font-extrabold tracking-widest text-text-primary uppercase leading-tight">
              SENTINEL<span className="text-sentinel-cyan">-X</span>
            </h1>
            <div className="font-mono text-[10px] text-sentinel-cyan tracking-widest uppercase font-bold mt-1 bg-cyan-950/40 px-3 py-1 rounded-full border border-cyan-500/30">
              SOC CYBER COMMAND PORTAL
            </div>
          </div>

          {/* Auth Form */}
          <form onSubmit={handleLogin} className="flex flex-col gap-5">
            <div>
              <label className="block font-mono text-[11px] text-text-secondary mb-2 uppercase tracking-wider font-bold">
                Analyst Clearance ID / Email
              </label>
              <div className="relative">
                <input
                  type="email"
                  required
                  value={email}
                  onChange={e => setEmail(e.target.value)}
                  placeholder="analyst@sentinel-x.io"
                  className="input-field-cyber"
                />
                <span className="absolute left-4 top-4 text-text-muted"><IconUser size={18} /></span>
              </div>
            </div>

            <div>
              <label className="block font-mono text-[11px] text-text-secondary mb-2 uppercase tracking-wider font-bold">
                Security Access Key / Password
              </label>
              <div className="relative">
                <input
                  type="password"
                  required
                  value={password}
                  onChange={e => setPassword(e.target.value)}
                  placeholder="••••••••••••"
                  className="input-field-cyber"
                />
                <span className="absolute left-4 top-4 text-text-muted"><IconKey size={18} /></span>
              </div>
            </div>

            <div>
              <label className="block font-mono text-[11px] text-text-secondary mb-2 uppercase tracking-wider font-bold">
                Security Clearance Level
              </label>
              <select
                value={clearance}
                onChange={e => setClearance(e.target.value)}
                className="input-field-cyber pl-4 bg-bg-surface text-text-primary outline-none cursor-pointer font-sans font-semibold"
              >
                <option value="Level 1 — Triage Operator">Level 1 — Triage Operator</option>
                <option value="Level 2 — Threat Investigator">Level 2 — Threat Investigator</option>
                <option value="Level 3 — Lead Commander">Level 3 — Lead Commander</option>
              </select>
            </div>

            <div className="flex justify-between items-center font-mono text-[11px] text-text-muted pt-1">
              <label className="flex items-center gap-2 cursor-pointer hover:text-text-secondary transition-colors">
                <input type="checkbox" defaultChecked className="rounded border-border-highlight accent-sentinel-cyan" />
                <span>Persist MFA Token</span>
              </label>
              <a href="#" className="text-sentinel-cyan hover:underline font-semibold">Reset Access Key?</a>
            </div>

            {/* Status indicator during auth */}
            {statusMsg && (
              <div className="bg-cyan-950/50 p-3 rounded-xl text-center text-sentinel-cyan font-mono text-xs flex items-center justify-center gap-2 border border-sentinel-cyan/40 shadow-lg">
                <span className="w-2.5 h-2.5 rounded-full bg-sentinel-cyan pulse-glow"></span>
                <span className="font-bold tracking-wider">{statusMsg}</span>
              </div>
            )}

            <button
              type="submit"
              disabled={!!statusMsg}
              className="btn-cyber-auth mt-2 flex items-center justify-center gap-3"
            >
              <IconFingerprint size={22} />
              <span>AUTHENTICATE ANALYST</span>
            </button>
          </form>

          {/* Footer */}
          <div className="text-center font-mono text-[10px] text-text-muted border-t border-border-subtle pt-4 tracking-wider">
            RESTRICTED TERMINAL — AUTHORIZED SOC PERSONNEL ONLY
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<LoginPage />);
  </script>
</body>
</html>
